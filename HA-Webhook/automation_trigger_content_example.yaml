alias: enviando_id
action: open_epaper_link.drawcustom
metadata: {}
data:
  rotate: 0
  dither: "0"
  ttl: 60
  refresh_type: "0"
  dry-run: false
  background: white
  payload:
    - type: text
      value: "{{ message }}"
      x: 50%
      "y": 90%
      anchor: mm
      size: 20
      color: red
target:
  device_id: "{{ device_id }}"



